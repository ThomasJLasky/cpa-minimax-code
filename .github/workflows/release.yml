name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.2.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
          # darwin/amd64 在 Apple Silicon 上交叉编译，避免 macos-13（Intel）排队
          - os: macos-14
            goos: darwin
            goarch: amd64
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-2022
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: build + package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./scripts/build.sh --package

      - name: smoke test zip layout
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="$(grep -o 'pluginVersion = "[^"]*"' dispatch.go | head -1 | cut -d'"' -f2)"
          case "$GOOS" in
            darwin) EXT=dylib ;;
            windows) EXT=dll ;;
            *) EXT=so ;;
          esac
          ZIP="dist/minimax-code_${VERSION}_${GOOS}_${GOARCH}.zip"
          echo "checking $ZIP"
          test -f "$ZIP"
          PY="$(command -v python3 || command -v python)"
          "$PY" - "$ZIP" "minimax-code.${EXT}" <<'PY'
          import sys, zipfile
          name, expected = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(name) as zf:
              names = zf.namelist()
              assert names == [expected], f"zip layout unexpected: {names}"
              info = zf.infolist()[0]
              assert info.file_size > 0, "artifact is empty"
          print(f"ok: {name} -> {names}")
          PY


      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: merge checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -name '*.zip' -exec cp {} out/ \;
          # 各平台 job 各自写了一份 checksums.txt，这里重新算一遍保证一致
          cd out
          sha256sum *.zip > checksums.txt
          ls -la
          cat checksums.txt

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            out/*.zip
            out/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
